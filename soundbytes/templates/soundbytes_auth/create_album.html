{% extends "authbase.html" %}
{% block title %}Create album{% endblock %}
{% block body %}
    <div class="form-card">
        <header class="page-heading">
            <h1>Create Album</h1>
        </header>
        <div class="card">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {% include "components/form_fields.html" %}
                    <button class="btn btn-primary" type="submit">Create Album</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
