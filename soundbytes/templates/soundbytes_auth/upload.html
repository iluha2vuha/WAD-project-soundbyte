{% extends "authbase.html" %}
{% block title %}Upload{% endblock %}
{% block body %}
    <div class="form-card">
        <header class="page-heading">
            <p class="eyebrow">Make some noise</p>
            <h1>Share something new.</h1>
            <p class="text-body-secondary">Upload a track or share a post with the community.</p>
        </header>
        <div class="card">
            <div class="card-body">
                <form action="{% url 'soundbytes:upload' %}"
                      method="post"
                      enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label" for="content_type">Upload type</label>
                        <select class="form-select" name="content_type" id="content_type">
                            <option value="song">Song</option>
                            <option value="post">Post</option>
                        </select>
                    </div>
                    <fieldset id="song_fields">
                        <legend class="visually-hidden">Song details</legend>
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label" for="song-title">Track title</label>
                                <input class="form-control"
                                       id="song-title"
                                       name="title"
                                       placeholder="Track title">
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label" for="song-artist">Artist</label>
                                <input class="form-control"
                                       id="song-artist"
                                       name="artist"
                                       placeholder="Artist name">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="song-album">Album</label>
                            <select class="form-select" id="song-album" name="album">
                                <option value="">Select an album</option>
                                {% for album in albums %}
                                    <option value="{{ album.id }}">{{ album.title }}</option>
                                {% endfor %}
                            </select>
                            <div class="form-text">Need an album? <a href="{% url 'soundbytes:create_album' %}">Create one first.</a>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="song-genres">Genres</label>
                            <select class="form-select" id="song-genres" name="genres" multiple>
                                {% for genre in genres %}
                                    <option value="{{ genre.id }}">{{ genre.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="song-tags">Tags</label>
                            <input class="form-control" id="song-tags" name="tags" placeholder="Tags">
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="song-audio">Audio file</label>
                            <input class="form-control"
                                   type="file"
                                   id="song-audio"
                                   name="audio_file"
                                   accept="audio/*">
                        </div>
                    </fieldset>
                    <fieldset id="post_fields" hidden disabled>
                        <legend class="visually-hidden">Post details</legend>
                        <div class="mb-3">
                            <label class="form-label" for="post-text">Your post</label>
                            <textarea class="form-control" id="post-text" name="text_content" rows="4" placeholder="What would you like to share?">
</textarea>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="post-image">Image (optional)</label>
                            <input class="form-control"
                                   type="file"
                                   id="post-image"
                                   name="image_file"
                                   accept="image/*">
                        </div>
                    </fieldset>
                    <button class="btn btn-primary" type="submit">Upload</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
