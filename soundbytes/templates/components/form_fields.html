{% for error in form.non_field_errors %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
{% endfor %}
{% for field in form %}
    <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">
            {{ field.label }}
            {% if field.field.required %}<span class="text-body-secondary" aria-hidden="true">*</span>{% endif %}
        </label>
        {{ field }}
        {% if field.help_text %}
            <div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
        {% endif %}
        {% if field.errors %}
            <div class="text-danger small mt-1" id="{{ field.auto_id }}_error" role="alert">
                {% for error in field.errors %}<p class="mb-1">{{ error }}</p>{% endfor %}
            </div>
        {% endif %}
    </div>
{% endfor %}
