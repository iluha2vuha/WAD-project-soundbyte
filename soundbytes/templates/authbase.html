<!DOCTYPE html>
{% load static %}

<html lang="en">
	<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
		{% block head %}
		{% endblock %}
		<title>
		{% block title %}
		{% endblock %}
		</title>
		<link rel="stylesheet" href="{% static 'css/styles.css' %}">
	</head>
	<body>
        <nav class="sidebar" aria-label="Main navigation">
            <div class="sidebar-main">
                <a href="{% url 'soundbytes:home' %}" class="sidebar-button">Home</a>
                <a href="{% url 'soundbytes:trending' %}" class="sidebar-button">Trending</a>
                <a href="{% url 'soundbytes:search_page' %}" class="sidebar-button">Search</a>
                {% if request.user.is_authenticated %}
                    <a href="{% url 'soundbytes:profile' request.user.username %}" class="sidebar-button">My Profile</a>
                    <a href="{% url 'soundbytes:playlists' request.user.username %}" class="sidebar-button">My Playlists</a>
                    <a href="{% url 'soundbytes:create_album' %}" class="sidebar-button">Create Album</a>
                    <a href="{% url 'soundbytes:upload_page' %}" class="sidebar-button">Upload Song</a>
                    <a href="{% url 'soundbytes:signout' %}" class="sidebar-button">Sign Out</a>
                {% else %}
                    <a href="{% url 'soundbytes:signin' %}" class="sidebar-button">Sign In</a>
                    <a href="{% url 'soundbytes:signup' %}" class="sidebar-button">Sign Up</a>
                {% endif %}
            </div>
        </nav>
        <div class="main">
			{% block body %}
			{% endblock %}
		</div>
	</body>
</html>
