{% extends "base.html" %}
{% block title %}Welcome{% endblock %}
{% block body %}
    <section class="hero my-lg-5 py-lg-5">
        <p class="eyebrow">Independent music. Shared here.</p>
        <h1 class="display-4 mb-3">A place for your sound.</h1>
        <p class="lead mb-4">Discover new music, follow independent artists and share what you've been working on.</p>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-primary"
               href="{% url 'soundbytes:home' %}">Explore Music <span aria-hidden="true">↗</span>
            </a>
            <a class="btn btn-outline-secondary"
               href="{% url 'soundbytes:signup' %}">Create an account</a>
        </div>
    </section>
{% endblock %}
