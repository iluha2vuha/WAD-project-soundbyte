{% extends 'base.html' %}
{% load static %}

{% block head %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            color: white;
            padding: 2rem;
        }
        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 2rem 0;
        }
        .btn {
            background: white;
            color: #667eea;
            padding: 1rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-outline {
            background: transparent;
            color: white;
            border: 2px solid white;
        }
    </style>
{% endblock %}

{% block title %}
	SoundByte - Music Streaming Platform
{% endblock %}

{% block body %}
    <div class="container">
        <h1>🎵 SoundByte</h1>
        <p>Discover, stream, and share amazing music with the world</p>
        <div class="buttons">
            <a href="{% url 'soundbytes:home' %}" class="btn">Explore Music</a>
            <a href="{% url 'soundbytes:signup' %}" class="btn btn-outline">Sign Up</a>
            <a href="{% url 'soundbytes:signin' %}" class="btn btn-outline">Sign In</a>
        </div>
    </div>
{% endblock %}
