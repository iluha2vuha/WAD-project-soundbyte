{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
    <div class="card auth-card">
        <div class="card-body">
            <p class="eyebrow">Your music awaits</p>
            <h1 class="h2 mb-2">Welcome back.</h1>
            <p class="text-body-secondary mb-4">Sign in to your SoundByte account.</p>
            {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}
            <form method="post" action="{% url 'soundbytes:signin' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control"
                           id="username"
                           name="username"
                           autocomplete="username"
                           required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control"
                           id="password"
                           name="password"
                           type="password"
                           autocomplete="current-password"
                           required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Sign In</button>
            </form>
            <p class="small text-body-secondary mt-4 mb-0">New here? <a href="{% url 'soundbytes:signup' %}">Create an account</a>
            </p>
        </div>
    </div>
{% endblock %}
